# Replace domain, certificates and PHP-FPM socket before installing.
<VirtualHost *:80>
 ServerName 192.0.2.20
 Redirect permanent / https://192.0.2.20/
</VirtualHost>
<VirtualHost *:443>
 ServerName 192.0.2.20
 DocumentRoot /var/www/html/LR_HOSxP_Live
 SSLEngine on
 SSLCertificateFile /etc/pki/tls/certs/lr-emr-fullchain.pem
 SSLCertificateKeyFile /etc/pki/tls/private/lr-emr.key
 ErrorLog /var/log/httpd/lr-emr-error.log
 CustomLog /var/log/httpd/lr-emr-access.log combined
 <Directory /var/www/html/LR_HOSxP_Live>
  Options -Indexes -Includes -ExecCGI
  AllowOverride None
  Require all granted
  DirectoryIndex index.php
  <FilesMatch "^(?:\..*|(?!(?:index|api|manual|risk|login|logout|usage|usage-history)\.php$).+\.[^./]+)$">
   Require all denied
  </FilesMatch>
  <FilesMatch "^(index|api|manual|risk|login|logout|usage|usage-history)\.php$">
   SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost/"
  </FilesMatch>
 </Directory>
 <Directory /var/www/html/LR_HOSxP_Live/.private>
  Require all denied
 </Directory>
 <Directory /var/www/html/LR_HOSxP_Live/database>
  Require all denied
 </Directory>
 <Directory /var/www/html/LR_HOSxP_Live/deploy>
  Require all denied
 </Directory>
 <Directory /var/www/html/LR_HOSxP_Live/tools>
  Require all denied
 </Directory>
</VirtualHost>
